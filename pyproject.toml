[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holler"
version = "0.1.0"
description = "Push-to-talk + scribble voice/vision input for Claude Agent SDK"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.80",
    "faster-whisper>=1.2.1",
    "sounddevice>=0.5.0",
    "numpy>=1.26",
    "mss>=10.0",
    "pywin32>=308",
    "keyboard>=0.13.5",
    "Pillow>=11.0",
    "PySide6>=6.8",
]

[project.scripts]
holler = "holler.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["holler*"]

# Non-Python files the app reads at runtime (icons, built-in session profiles).
[tool.setuptools.package-data]
"holler.icons" = ["*.svg"]
"holler" = ["profiles/*.md", "qss_assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
